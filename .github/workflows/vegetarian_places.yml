name: Test PrachinLife Vegetarian Places

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-vegetarian-places:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run vegetarian places collector
        run: |
          python collectors/vegetarian_places.py

      - name: Build vegetarian index
        run: |
          python scripts/build_vegetarian_index.py

      - name: Show collected data summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          raw_path = Path("data/raw/vegetarian_places.json")
          index_path = Path("vegetarian_index.json")

          if not raw_path.exists():
              raise SystemExit("vegetarian_places.json not found")

          if not index_path.exists():
              raise SystemExit("vegetarian_index.json not found")

          raw_data = json.loads(
              raw_path.read_text(encoding="utf-8")
          )

          index_data = json.loads(
              index_path.read_text(encoding="utf-8")
          )

          print("RAW TOTAL =", len(raw_data))
          print("INDEX TOTAL =", len(index_data))

          print()
          print("PUBLISHED PLACES")

          for item in index_data[:20]:
              print(
                  item.get("title"),
                  "|",
                  item.get("location", {}).get("province"),
                  "| vegetarian =",
                  item.get("dietary", {}).get("vegetarian_status"),
                  "| vegan =",
                  item.get("dietary", {}).get("vegan_status"),
                  "| jay =",
                  item.get("dietary", {}).get("jay_status"),
              )
          PY

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: vegetarian-places-data
          path: |
            data/raw/vegetarian_places.json
            vegetarian_index.json
