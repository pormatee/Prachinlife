name: Test PrachinLife Eat OSM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-eat-osm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ==============================================
      # COLLECT
      # ==============================================

      - name: Collect PrachinLife Eat data from OSM
        run: python collectors/restaurants_osm.py

      # ==============================================
      # NORMALIZE
      # ==============================================

      - name: Normalize PrachinLife Eat data
        run: python normalizers/restaurants.py

      # ==============================================
      # BUILD COMMON INDEX
      # ==============================================

      - name: Build PrachinLife common index
        run: python scripts/build_prachinlife_index.py

      # ==============================================
      # SUMMARY
      # ==============================================

      - name: Show Eat and common index summary
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          restaurants_path = Path(
              "data/normalized/restaurants.json"
          )

          index_path = Path(
              "data/normalized/prachinlife_index.json"
          )

          frontend_index_path = Path(
              "prachinlife_index.json"
          )

          if not restaurants_path.exists():
              raise SystemExit(
                  "Missing normalized Eat data"
              )

          if not index_path.exists():
              raise SystemExit(
                  "Missing normalized common index"
              )

          if not frontend_index_path.exists():
              raise SystemExit(
                  "Missing frontend common index"
              )

          restaurants = json.loads(
              restaurants_path.read_text(
                  encoding="utf-8"
              )
          )

          index_data = json.loads(
              index_path.read_text(
                  encoding="utf-8"
              )
          )

          print(
              "Normalized Eat records =",
              len(restaurants),
          )

          content_counts = Counter(
              item.get(
                  "content_type",
                  "unknown",
              )
              for item
              in index_data
          )

          print(
              "Total common index records =",
              len(index_data),
          )

          print(
              "Content counts =",
              dict(content_counts),
          )

          eat_records = [
              item
              for item in index_data
              if item.get("content_type") == "eat"
          ]

          print(
              "Eat records in common index =",
              len(eat_records),
          )

          print()
          print("First 10 Eat records:")

          for item in eat_records[:10]:
              location = item.get(
                  "location",
                  {},
              )

              print(
                  "-",
                  item.get("title"),
                  "|",
                  item.get("category"),
                  "|",
                  location.get("district"),
              )

          if len(eat_records) != len(restaurants):
              raise SystemExit(
                  "Eat record count mismatch "
                  "between restaurants.json "
                  "and common index"
              )

          print()
          print("FINAL RESULT: PASS")
          PY

      # ==============================================
      # COMMIT
      # ==============================================

      - name: Commit Eat and common index data
        run: |
          git config user.name "PrachinLife Bot"
          git config user.email "bot@prachinlife.local"

          git add \
            data/raw/restaurants_osm.json \
            data/normalized/restaurants.json \
            data/normalized/prachinlife_index.json \
            prachinlife_index.json

          if git diff --cached --quiet; then
            echo "No Eat or common index changes"
          else
            git commit -m "Update PrachinLife Eat and common index"
            git push
          fi
