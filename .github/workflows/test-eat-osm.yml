name: Test PrachinLife Eat OSM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-eat-osm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ==============================================
      # COLLECT
      # ==============================================

      - name: Collect PrachinLife Eat data from OSM
        run: python collectors/restaurants_osm.py

      # ==============================================
      # NORMALIZE
      # ==============================================

      - name: Normalize PrachinLife Eat data
        run: python normalizers/restaurants.py

      # ==============================================
      # SUMMARY
      # ==============================================

      - name: Show Eat data summary
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          raw_path = Path(
              "data/raw/restaurants_osm.json"
          )

          normalized_path = Path(
              "data/normalized/restaurants.json"
          )

          if not raw_path.exists():
              raise SystemExit(
                  "Missing raw Eat data"
              )

          if not normalized_path.exists():
              raise SystemExit(
                  "Missing normalized Eat data"
              )

          raw_data = json.loads(
              raw_path.read_text(
                  encoding="utf-8"
              )
          )

          normalized_data = json.loads(
              normalized_path.read_text(
                  encoding="utf-8"
              )
          )

          print(
              "Raw records =",
              len(raw_data),
          )

          print(
              "Normalized records =",
              len(normalized_data),
          )

          categories = Counter(
              item.get(
                  "category",
                  "unknown",
              )
              for item
              in normalized_data
          )

          print(
              "Category counts =",
              dict(categories),
          )

          print()

          print(
              "First 10 normalized places:"
          )

          for item in normalized_data[:10]:
              print(
                  "-",
                  item.get("name"),
                  "|",
                  item.get("category"),
                  "|",
                  item.get("location", {}).get(
                      "district"
                  ),
              )
          PY

      # ==============================================
      # COMMIT
      # ==============================================

      - name: Commit Eat test data
        run: |
          git config user.name "PrachinLife Bot"
          git config user.email "bot@prachinlife.local"

          git add \
            data/raw/restaurants_osm.json \
            data/normalized/restaurants.json

          if git diff --cached --quiet; then
            echo "No Eat data changes"
          else
            git commit -m "Update PrachinLife Eat test data"
            git push
          fi
