name: Update PrachinLife Promotions

on:
  workflow_dispatch:

  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:
  update-promotions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect Big C raw data
        run: python collectors/bigc.py

      - name: Collect Lotus raw data
        run: python collectors/lotus.py

      - name: Normalize Big C data
        run: python normalizers/bigc.py

      - name: Normalize Lotus data
        run: python normalizers/lotus.py

      - name: Merge promotion sources
        run: python scripts/merge_promotions.py

      - name: Validate merged promotion data
        run: python scripts/validate_data.py

      - name: Commit updated promotion data
        run: |
          git config user.name "PrachinLife Bot"
          git config user.email "bot@prachinlife.local"

          git add \
            data/raw/bigc.json \
            data/raw/lotus.json \
            data/normalized/bigc.json \
            data/normalized/lotus.json \
            data/normalized/promotions.json \
            promotions.json

          if git diff --cached --quiet; then
            echo "No promotion changes"
          else
            git commit -m "Auto update PrachinLife promotions"
            git push
          fi
